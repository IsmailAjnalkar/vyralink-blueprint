# Every push and pull request: type checks, lint, dependency audit, API tests, the GlowSkin end-to-end run in a
# browser (with the accessibility sweep), and the three Docker images. Nothing is deployed from here.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Type check, lint, audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm run typecheck -w @vyralink/api
      - run: npm run typecheck -w @vyralink/web
      - run: npx eslint src --max-warnings 1 # the one allowed warning: react-hook-form watch() in sign-up
        working-directory: apps/web
      - run: npm audit --omit=dev --audit-level=low

  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DB_BASE: postgres://postgres:postgres@127.0.0.1:5432
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npm test -w @vyralink/api

  e2e:
    name: GlowSkin end to end (browser) + accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/vyralink_e2e
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx next build
        working-directory: apps/web
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v5
        with: { name: e2e-results, path: test-results, retention-days: 7 }

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build --target api -t vyralink-api .
      - run: docker build --target worker -t vyralink-worker .
      - run: docker build --target web -t vyralink-web .
